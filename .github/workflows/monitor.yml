name: Production Monitor

on:
  schedule:
    - cron: '0 * * * *' # Chạy tự động định kỳ mỗi 1 giờ
  workflow_dispatch: # Cho phép bấm chạy thủ công bằng tay trên giao diện GitHub

jobs:
  monitor-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Đăng nhập Postman
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Chạy kịch bản Monitor trực tiếp từ Cloud
        run: postman collection run "59052060-2c331156-45f3-4ca9-8b1f-0dd0482d09ba"
