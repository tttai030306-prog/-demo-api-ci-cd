name: Restful-Booker CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Newman
        run: npm install -g newman
      - name: Run API collection with CSV data
        run: >
          newman run RestfulBooker.postman_collection.json
          -e RestfulBooker.postman_environment.json
          -d booking_data.csv
          --reporters cli
